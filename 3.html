<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>如实回答</title>
<style>
  :root {
    --bg: #eef1f5;
    --ink: #14181f;
    --muted: #6b7380;
    --line: #c9d0da;
    --blue: #1a6dff;
    --blue-dark: #0f55d4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    display: flex;
    justify-content: center;
    padding: 0;
  }

  /* 向内的蓝色边框 */
  .frame {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    box-shadow: inset 0 0 25px 6px rgba(30, 144, 255, 0.75),
                inset 0 0 6px 2px rgba(80, 180, 255, 0.9);
  }

  .page {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column;
    padding: 2.5vh 3vw 3vh;
    overflow-y: auto; /* 内容太长时可以在框内滚动 */
  }

  main {
    flex: none;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 8vh 12px 6vh;
  }
  h1 {
    font-size: 44px;
    font-weight: 900;
    color: #000;
    letter-spacing: .2em;
    text-align: center;
    margin: 0 0 56px;
  }
  .item { margin-bottom: 28px; }
  .field {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  label {
    flex: 0 0 6em;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
    padding-top: 10px;
  }
  textarea {
    flex: 1;
    min-width: 0;
    min-height: 84px;
    resize: vertical;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: #fff;
    padding: 12px 14px;
    font: inherit;
    font-size: 17px;
    line-height: 1.6;
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--blue); }
  .send {
    flex: 0 0 auto;
    align-self: stretch;
    min-width: 58px;
    border: 0;
    border-radius: 14px;
    background: var(--blue);
    color: #fff;
    font: inherit;
    font-size: 17px;
    cursor: pointer;
    transition: background .2s;
  }
  .send:hover { background: var(--blue-dark); }
  .send:focus-visible { outline: 3px solid #9cc0ff; outline-offset: 3px; }
  .send:disabled { opacity: .6; cursor: default; }
  .msg {
    margin: 8px 0 0 calc(6em + 10px);
    font-size: 15px;
    min-height: 20px;
  }
  .msg.ok { color: #12805c; }
  .msg.err { color: #c0392b; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="page">
<main>
  <h1>如实回答</h1>

  <div class="item" data-name="衣服">
    <div class="field">
      <label for="clothes">你对我的衣服的评价：</label>
      <textarea id="clothes"></textarea>
      <button type="button" class="send">提交</button>
    </div>
    <div class="msg" role="status"></div>
  </div>

  <div class="item" data-name="帽子">
    <div class="field">
      <label for="hat">你对我帽子的评价：</label>
      <textarea id="hat"></textarea>
      <button type="button" class="send">提交</button>
    </div>
    <div class="msg" role="status"></div>
  </div>

  <div class="item" data-name="鞋子">
    <div class="field">
      <label for="shoes">你对我鞋子的评价：</label>
      <textarea id="shoes"></textarea>
      <button type="button" class="send">提交</button>
    </div>
    <div class="msg" role="status"></div>
  </div>
  </main>
</div>

<script>
  // Web3Forms 的 Access Key（公开的，可以放在网页里）
  const ACCESS_KEY = "2ef60e67-71c5-46c9-8fe5-2173051adc13";
  const ENDPOINT = "https://api.web3forms.com/submit";

  document.querySelectorAll(".item").forEach((item) => {
    const name = item.dataset.name;
    const box = item.querySelector("textarea");
    const btn = item.querySelector(".send");
    const msg = item.querySelector(".msg");

    btn.addEventListener("click", async () => {
      const text = box.value.trim();
      msg.className = "msg";
      msg.textContent = "";

      if (!text) {
        msg.className = "msg err";
        msg.textContent = "先写点什么再提交。";
        return;
      }

      btn.disabled = true;
      btn.textContent = "…";
      try {
        const data = new FormData();
        data.append("access_key", ACCESS_KEY);
        data.append("subject", "有人评价了你的" + name);
        data.append("评价对象", name);
        data.append("评价内容", text);
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Accept": "application/json" },
          body: data
        });
        const result = await res.json();
        if (res.ok && result.success) {
          box.value = "";
          msg.className = "msg ok";
          msg.textContent = "已收到，谢谢你的评价。";
        } else {
          throw new Error();
        }
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "提交失败，请检查网络后重试。";
      } finally {
        btn.disabled = false;
        btn.textContent = "提交";
      }
    });
  });
</script>
</body>
</html>
